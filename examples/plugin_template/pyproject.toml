[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sensoryforge-plugin-template"
version = "0.1.0"
description = "A standalone SensoryForge plugin adding one receptive-field builder and one processing layer"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["sensoryforge"]

[project.entry-points."sensoryforge.components"]
radial_falloff = "sensoryforge_plugin_template.rf_builder:register"
gain_threshold = "sensoryforge_plugin_template.processing:register"

[tool.setuptools.packages.find]
where = ["."]
include = ["sensoryforge_plugin_template*"]
