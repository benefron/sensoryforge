[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sensoryforge-ring-shape"
version = "0.1.0"
description = "SensoryForge world plugin: a ring-shaped stimulus"
requires-python = ">=3.10"
dependencies = ["sensoryforge"]

[project.optional-dependencies]
test = ["pytest"]

[project.entry-points."sensoryforge.components"]
ring_shape = "sensoryforge_ring_shape.shape:register"

[tool.setuptools.packages.find]
where = ["."]
include = ["sensoryforge_ring_shape*"]
