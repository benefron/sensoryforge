[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sensoryforge-leaky-threshold"
version = "0.1.0"
description = "SensoryForge neuron plugin: LeakyThresholdNeuronTorch"
requires-python = ">=3.10"
dependencies = ["sensoryforge"]

[project.entry-points."sensoryforge.components"]
leaky_threshold = "sensoryforge_leaky_threshold.component:register"

[tool.setuptools.packages.find]
where = ["."]
include = ["sensoryforge_leaky_threshold*"]
