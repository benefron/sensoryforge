# v1.1.0's full element set as a world file: the EXTRA world of
# tests/unit/test_world_render.py (grid, list and random patterns, declared
# linear and path motion, gabor, a signed square grating, a hard disc, a flat
# bar). Frozen: the v1.1.0 compatibility guard (test_world_v1_1_compat.py)
# pins what it produces. Do not edit it.
world:
  defaults:
    delay_ms:
      range: [0, 20]
    touch_ms:
      range: [5, 15]
    hold_ms:
      range: [20, 60]
    release_ms:
      range: [5, 15]
    speed_mm_per_ms:
      range: [0.005, 0.02]
      dist: log_uniform
    direction_deg:
      range: [0, 360]
      circular: true
    amplitude:
      range: [0.5, 1.0]
    x_mm:
      range: [-0.2, 0.2]
    y_mm:
      range: [-0.2, 0.2]
  classes:
    grid_dots:
      layer:
        shape: {kind: gaussian, sigma_mm: 0.08}
        pattern: {kind: grid, rows: 2, cols: 3}
      axes:
        spacing_mm:
          range: [0.2, 0.3]
        mask:
          values: ['', 101 011, 111 010]
    list_dots:
      layer:
        shape: {kind: gaussian}
        pattern:
          kind: list
          positions:
          - [-0.3, 0.1]
          - [0.25, -0.2]
          - [0.0, 0.3]
          amplitudes: [1.0, 0.6, 0.8]
      axes:
        sigma_mm:
          range: [0.05, 0.15]
    random_dots:
      layer:
        shape: {kind: gaussian, sigma_mm: 0.07}
        pattern: {kind: random, count: 6, width_mm: 0.8, height_mm: 0.8, min_distance_mm: 0.1,
          amplitude_jitter: 0.3}
      axes:
        seed:
          range: [0, 1000]
          int: true
    linear_slide:
      layer:
        shape: {kind: gaussian, sigma_mm: 0.15}
        motion:
          kind: linear
          start: [-0.3, 0]
          end: [0.3, 0.2]
      axes:
        slide_ms:
          range: [20, 40]
        hold_ms:
          range: [5, 20]
    path_slide:
      layer:
        shape: {kind: gaussian, sigma_mm: 0.15}
        motion:
          kind: path
          waypoints:
          - [-0.3, -0.3]
          - [0.3, -0.3]
          - [0.3, 0.3]
      axes:
        slide_ms:
          range: [20, 40]
        hold_ms:
          range: [5, 20]
        contacts: {value: 2}
        pause_ms:
          range: [5, 10]
    gabor:
      layer:
        shape: {kind: gabor}
      axes:
        sigma_mm:
          range: [0.2, 0.4]
        wavelength_mm:
          range: [0.2, 0.5]
        orientation_deg:
          range: [0, 180]
        phase_deg:
          range: [0, 360]
        signed:
          values: [true, false]
    square_signed:
      layer:
        shape: {kind: grating, profile: square, signed: true}
      axes:
        wavelength_mm:
          range: [0.3, 0.6]
        duty:
          range: [0.2, 0.7]
        orientation_deg:
          range: [0, 180]
        phase_deg:
          range: [0, 360]
        slide_ms:
          range: [10, 20]
    hard_disc:
      layer:
        shape: {kind: disc, edge_mm: 0}
        pattern: {kind: grid, rows: 1, cols: 2}
      axes:
        diameter_mm:
          range: [0.2, 0.4]
        spacing_mm:
          range: [0.4, 0.5]
        slide_ms:
          range: [10, 20]
    flat_bar:
      layer:
        shape: {kind: bar, profile: flat}
      axes:
        width_mm:
          range: [0.1, 0.3]
        length_mm:
          range: [0.3, 0.8]
        orientation_deg:
          range: [0, 180]
        slide_ms:
          range: [10, 20]
