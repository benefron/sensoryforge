# A test world with one class per v1.2 element (grows task by task). Values
# are placeholders sized for SensoryForge's small canvases and 8x8 design.
world:
  name: elements_v1_2
  description: one class per v1.2 world element
  modality: tactile
  units: {space: mm, time: ms}
  defaults:
    delay_ms:   {range: [0, 20]}
    touch_ms:   {range: [5, 15]}
    hold_ms:    {range: [20, 60]}
    release_ms: {range: [5, 15]}
    amplitude:  {range: [0.5, 1.0]}
    x_mm: {range: [-0.2, 0.2]}
    y_mm: {range: [-0.2, 0.2]}
    unit_mm: {value: 0.05}
  groups:
    press:
      touch_ms: {range: [8, 14]}
      hold_ms: {range: [20, 40]}
      release_ms: {same_as: touch_ms}
  classes:
    grouped_press:
      weight: 1
      use: [press]
      layer: {shape: {kind: gaussian, sigma_mm: 0.15}}
    bg_dots:
      weight: 1
      layer: {shape: {kind: gaussian, sigma_mm: 0.2}}
      axes: {background: {range: [0.1, 0.4]}}
    relief:
      weight: 1
      layer:
        shape: {kind: grating, signed: true, wavelength_mm: 0.4}
        clamp_min: 0.0
      axes:
        background: {range: [0.2, 0.5]}
        orientation_deg: {range: [0, 180], circular: true}
    lateral_slide:
      weight: 1
      layer: {shape: {kind: gaussian, sigma_mm: 0.2}}
      axes:
        slide_ms: {range: [20, 40]}
        speed_mm_per_ms: {range: [0.001, 0.004]}
        direction_deg: {dist: biased_direction, travel_ratio: 2.5, axis_deg: 0}
    tied_press:
      weight: 1
      layer: {shape: {kind: gaussian, sigma_mm: 0.2}}
      axes:
        release_ms: {same_as: touch_ms}
        contacts: {range: [2, 4], int: true}
    rough:
      weight: 1
      layer:
        shape: {kind: self_affine, hurst: 0.8, rolloff_mm: 0.6, cutoff_mm: 0.12, components: 64}
        clamp_min: 0.0
      axes:
        seed: {range: [0, 16777215], int: true, stratify: false}
        background: {range: [0.6, 1.0]}
        components: {range: [16, 64], int: true}
    dots:
      weight: 1
      layer:
        shape: {kind: dot_array, sigma_mm: 0.12, spacing_mm: 0.7, arrangement: hexagonal}
      axes:
        orientation_deg: {range: [0, 180], circular: true}
    sphere:
      weight: 1
      layer:
        shape: {kind: curved_contact, form: sphere, radius_mm: 0.8}
      axes:
        amplitude: {range: [0.6, 1.5]}
    cylinder:
      weight: 1
      layer:
        shape: {kind: curved_contact, form: cylinder, radius_mm: 0.8}
      axes:
        amplitude: {range: [0.6, 1.5]}
        orientation_deg: {range: [0, 180], circular: true}
        background: {range: [0.1, 0.3]}
    step:
      weight: 1
      layer:
        shape: {kind: step_edge, shoulder_radius_mm: 0.5}
      axes:
        amplitude: {range: [0.6, 1.5]}
        orientation_deg: {range: [0, 360], circular: true}
    braille_text:
      weight: 1
      layer:
        shape: {kind: gaussian, sigma_mm: 0.05}
        pattern:
          kind: braille
          dot_spacing_mm: 0.1
          cell_spacing_mm: 0.3
          line_spacing_mm: 0.4
          x_mm: -0.3
          y_mm: 0.2
      axes:
        text: {dist: letter_text, cells: 2, lines: 2, stratify: false}
