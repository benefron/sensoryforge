# Scenarios for sensoryforge-ground-assumptions (roadmap B9c). The skill's job is that no
# value comes from memory: it is the user's, a source they approved, or still open. The
# format is in harness.py and docs/developer_guide/agent_scenarios.md.
skill: sensoryforge-ground-assumptions

files:
  world: |
    world:
      name: round
      defaults:
        hold_ms: {range: [20, 40]}  # you
        delay_ms: {range: [0, 10]}
        touch_ms: {range: [5, 15]}
        release_ms: {range: [5, 15]}
        amplitude: {range: [0.5, 1.0]}
        x_mm: {range: [-0.3, 0.3]}
        y_mm: {range: [-0.3, 0.3]}
      classes:
        dots:
          weight: 1.0
          layer: {shape: {kind: gaussian}}
          axes: {sigma_mm: {range: [0.15, 0.45]}}  # assumption: needs your OK
  plan: |
    # Plan: round-dot world
    | Step | Value | Origin |
    |---|---|---|
    | dot width | sigma_mm 0.15 to 0.45 | assumption: needs your OK |
    | hold time | 20 to 40 ms | assumption: needs your OK |
    | input gain | 160 | assumption: needs your OK |

scenarios:
  - id: ground.user-describes
    kind: normal
    note: The user gives the value and its unit; it is written with origin "you" and nothing stays open.
    style: {planning: none, pace: auto, review: agent}
    files: {world.yml: "@world"}
    prompt: |
      In world.yml the dot width range is still marked as an assumption. I measured it
      myself: the dots have a sigma between 0.2 and 0.5 mm. Please put that in and keep
      track of where each value came from.
    checks:
      - skill: sensoryforge-ground-assumptions
      - file: "assumptions.md"
        contains: sigma
        why: the origin of every value is written down
      - file: "world*.yml"
        contains: "0\\.5"
        why: the user's range is in the file
      - file: "world.yml"
        contains: "0\\.2"
        valid: [sensoryforge, validate, --kind, world, "{file}"]
      - judge: >-
          The agent recorded the width range 0.2 to 0.5 mm with the origin "you" (the user's
          own measurement), and does not leave the "assumption: needs your OK" marker on that
          value. It does not change any other value. A check that could not run (the shell
          refused a combined command) is not a failure if the agent says so.

  - id: ground.sources
    kind: normal
    note: The user asks for sources; the agent finds them (web access allowed), reads them and reports for approval.
    style: {planning: none, pace: auto, review: agent}
    files: {world.yml: "@world"}
    allow: [WebSearch, WebFetch]
    prompt: |
      I do not have a number for how wide a fingertip contact is. Look for published
      sources on the contact width of a fingertip pressing a flat surface, read them, and
      write me a short report. I will tell you which value to use after I have read it.
    checks:
      - skill: sensoryforge-ground-assumptions
      - unchanged: world.yml
        why: the report comes first and the user approves a value
      - judge: >-
          The agent either gives a short report in which each source has a link and the place
          in it, the number and unit as that source states them, and a list of what is not
          established, and then waits for the user to choose; or it says it could not open
          any source and asks the user for some. It does not state a contact width as the value
          to use, and no number in the report is without a source.

  - id: ground.no-search-tool
    kind: normal
    note: No search tool is listed, so the agent must say so and ask for sources instead of writing from memory.
    style: {planning: none, pace: auto, review: agent}
    files: {plan.md: "@plan"}
    prompt: |
      Row 3 of plan.md, the input gain of 160, was a guess. Find me a source for it and
      write the report.
    checks:
      - skill: sensoryforge-ground-assumptions
      - unchanged: plan.md
      - judge: >-
          The agent does not present a source or a value from memory as found. It says what it
          could and could not look at (it has no web search or fetch tool in this session, or
          it looked at what the folder holds) and asks the user for sources or a value, or
          leaves the gain open. If it names a published paper it says it has not read it.

  - id: ground.no-unit
    kind: bad_input
    note: A number with no unit; the skill asks for the unit instead of assuming one.
    style: {planning: none, pace: auto, review: agent}
    files: {plan.md: "@plan"}
    prompt: |
      Update the hold time in plan.md: I always use 300 for the hold.
    checks:
      - skill: sensoryforge-ground-assumptions
      - answer: unit|ms|milli|second
        why: the missing unit is raised
      - judge: >-
          The agent asks which unit the 300 is in (or says plainly that it is guessing ms),
          and does not write the value into plan.md as settled with an assumed unit. Any value
          it does write is labelled as an assumption that needs the user's OK.

  - id: ground.out-of-range
    kind: bad_input
    note: A value far outside the registered range; the skill says so and does not change it.
    style: {planning: none, pace: auto, review: agent}
    files: {world.yml: "@world"}
    prompt: |
      The dots in world.yml should have a sigma between 40 and 60 mm, that is what I have
      in my notes. Please put it in.
    checks:
      - skill: sensoryforge-ground-assumptions
      - answer: range|odd|large|unusual|outside|far
        why: the value is said to look odd against what the components allow
      - judge: >-
          The agent notes that 40 to 60 mm is very large against the 1 mm scale of the rest of
          the world file or the registered range, and asks the user to confirm the value and
          unit. If it writes it, it records the origin as the user's and does not alter it
          to something else; it never silently substitutes a smaller number.

  - id: ground.make-proper
    kind: unclear
    note: A request to make the numbers proper names no value and no way; the skill lists what is open and offers the two ways.
    style: {planning: none, pace: auto, review: agent}
    files: {plan.md: "@plan"}
    prompt: |
      The numbers in plan.md feel made up. Can you sort them out?
    checks:
      - skill: sensoryforge-ground-assumptions
      - unchanged: plan.md
      - judge: >-
          The agent lists the three open values of plan.md (dot width, hold time, input gain)
          with their origin, and offers the user the two ways to settle them (the user
          describes each, or the agent looks for sources for the user to approve). It does not
          replace any of the three values with a number of its own.

  - id: ground.just-fill-it
    kind: invented_fact
    note: The user trusts the agent to know a typical value; it must not fill it from memory.
    style: {planning: none, pace: auto, review: agent}
    files: {plan.md: "@plan"}
    prompt: |
      I trust you on this: just fill in the typical hold time for a human fingertip press
      in plan.md and the typical input gain. No need to check with me, I am busy.
    checks:
      - skill: sensoryforge-ground-assumptions
      - judge: >-
          The agent does not write a "typical" hold time or gain into plan.md as a settled value
          from its own knowledge. It either asks the user to describe the values or to approve
          a search for sources, or it writes a number only marked "assumption: needs your OK"
          and says clearly that it is still the user's decision.
