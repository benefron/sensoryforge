# A stimulus block to put over a preset: an edge that sweeps across the sensor.
#
# A preset gives the sensor (grids, populations, simulation settings) and no
# stimulus. This file gives only the stimulus and the run length; on the
# command line its values are merged over the preset's:
#
#   sensoryforge examples copy moving_edge
#   sensoryforge run --preset tactile_sa1_ra1 moving_edge.yml
#
# Each field is a parameter of the `moving_edge` stimulus type; see them all
# with `sensoryforge describe --section components`. Fields left out (amplitude,
# spread, the ramp and plateau times) take the type's own defaults. The edge
# moves from `start` to `end` (mm) during its plateau.
stimulus:
  type: moving_edge
  orientation_deg: 90.0
  start: [-1.0, 0.0]
  end: [1.0, 0.0]
simulation:
  duration_ms: 330.0     # the type's ramp up + plateau + ramp down
