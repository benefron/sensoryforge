# vision_onoff_rgb -- the generality demo (Phase 2, Wave M, M4)
#
# One grid with three named channels (R, G, B) -- three independent stimuli
# each drive one channel (see examples/vision_rgb_onoff.py, which also
# renders and composes them; this file only has grids/populations, like
# tactile_sa1_ra1.yml). Two populations read the same grid differently:
#
# - "RG OnOff Population": reads R and G, each through an OnOffLayer
#   (Wave M3, centre-surround DoG -> ON/OFF planes) and combines with
#   combine: sum -- one set of neurons, driven by R's ON/OFF and G's ON/OFF
#   added together.
# - "RGB Concat Population": reads R, G and B directly (no processing) and
#   combines with combine: concat -- three independent blocks of neurons,
#   one per channel.
#
# This is the concrete proof that SimulationEngine (Wave M1/M2) is no
# longer tactile-only: a population may read more than one channel/grid,
# with an optional processing stage per input, and combine the results by
# summing or concatenating.
#
# See docs/concepts/populations_and_inputs.md and
# docs/extending/add_processing_layer.md.
#
# Usage:
#   python examples/vision_rgb_onoff.py
metadata:
  name: Vision ON/OFF RGB demo
  version: '1.0'
  description: >-
    One 3-channel (R, G, B) grid; one population reads R and G through
    OnOffLayer and sums, one reads all three and concatenates (M4).
grids:
- name: RGB Grid
  arrangement: grid
  rows: 32
  cols: 32
  spacing: 0.15
  center_x: 0.0
  center_y: 0.0
  channels:
  - R
  - G
  - B
populations:
- name: RG OnOff Population
  neuron_type: SA
  neurons_per_row: 8
  inputs:
  - grid: RGB Grid
    channel: R
    processing:
    - method: onoff
  - grid: RGB Grid
    channel: G
    processing:
    - method: onoff
  combine: sum
  neuron_model: izhikevich
  filter_method: sa
  input_gain: 50.0
  seed: 42
- name: RGB Concat Population
  neuron_type: SA
  neurons_per_row: 6
  inputs:
  - grid: RGB Grid
    channel: R
  - grid: RGB Grid
    channel: G
  - grid: RGB Grid
    channel: B
  combine: concat
  neuron_model: izhikevich
  filter_method: sa
  input_gain: 50.0
  seed: 43
simulation:
  device: cpu
  dt_ms: 1.0
