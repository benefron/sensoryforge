name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  non-gui:
    name: non-gui (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install sensoryforge
        run: pip install -e ".[gui,hdf5,dsl,dev]"

      - name: Run non-GUI tests
        run: pytest -m "not gui"

  gui:
    name: gui (ubuntu, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-shape0 \
            libgl1 \
            libglib2.0-0 \
            libfontconfig1 \
            libdbus-1-3

      - name: Install CPU torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install sensoryforge
        run: pip install -e ".[gui,hdf5,dsl,dev]"

      - name: Run GUI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -m gui

  lint-and-docs:
    name: lint, format, docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install sensoryforge
        run: pip install -e ".[gui,hdf5,dsl,dev,docs]"

      - name: black --check
        run: black --check sensoryforge tests

      - name: flake8
        run: flake8 sensoryforge tests

      - name: mkdocs build --strict
        run: mkdocs build --strict
