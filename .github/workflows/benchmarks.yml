name: benchmarks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-guard:
    name: performance regression guard (T3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install sensoryforge
        run: pip install -e ".[dev]"

      - name: Run the fast ci_guard benchmark cell and compare to baseline
        env:
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: python -m benchmarks.check_regression
