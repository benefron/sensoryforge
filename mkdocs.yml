site_name: SensoryForge Documentation
site_description: An extensible playground for simulating sensory encoding and generating population activity
site_author: SensoryForge Team  
site_url: https://benefron.github.io/sensoryforge

repo_name: benefron/sensoryforge
repo_url: https://github.com/benefron/sensoryforge
edit_uri: edit/main/docs/

# Internal engineering records (reviews, handover notes) stay in the repo
# under docs/ for discoverability but are not part of the published site
# (F-029: the reviews move under docs/ added mkdocs build warnings from
# their relative code links, which --strict would fail on).
exclude_docs: |
  development/agent_runs/
  development/reviews/
  development/handover/
  development/specs/
  development/plans/
  development/roadmap_v1.md
  development/EQUATION_DSL_IMPLEMENTATION.md

theme:
  name: material
  language: en
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - redirects:
      redirect_maps:
        EQUATION_DSL_IMPLEMENTATION.md: how-to/equation_dsl.md
        api_reference/neurons.md: reference/api_neurons.md
        api_reference/pipeline.md: reference/api_pipeline.md
        developer_guide/add_filter.md: how-to/extend/add_filter.md
        developer_guide/add_neuron.md: how-to/extend/add_neuron.md
        developer_guide/add_rf_builder.md: how-to/extend/add_rf_builder.md
        developer_guide/add_stimulus.md: how-to/extend/add_stimulus.md
        developer_guide/agent_files.md: reference/maintainers/agent_files.md
        developer_guide/agent_scenarios.md: reference/maintainers/agent_scenarios.md
        developer_guide/architecture_notes.md: concepts/architecture_notes.md
        developer_guide/audit_metrics.md: reference/evaluate/audit_metrics.md
        developer_guide/audit_reader.md: reference/evaluate/audit_reader.md
        developer_guide/checks_stage.md: reference/evaluate/checks_stage.md
        developer_guide/compare_stage.md: reference/evaluate/compare_stage.md
        developer_guide/declared_adapter.md: reference/evaluate/declared_adapter.md
        developer_guide/diff_stage.md: reference/evaluate/diff_stage.md
        developer_guide/evaluation_server.md: reference/evaluate/evaluation_server.md
        developer_guide/extensibility.md: how-to/extend/extensibility.md
        developer_guide/file_headers.md: reference/maintainers/file_headers.md
        developer_guide/pipeline_stage.md: reference/evaluate/pipeline_stage.md
        developer_guide/plugins.md: how-to/extend/plugins.md
        developer_guide/reference_plugins.md: how-to/extend/reference_plugins.md
        developer_guide/release_checklist.md: reference/maintainers/release_checklist.md
        developer_guide/roadmap_v1.md: index.md
        developer_guide/toy_vision_fixture.md: reference/toy_vision_fixture.md
        extending/add_grid_arrangement.md: how-to/extend/add_grid_arrangement.md
        extending/add_processing_layer.md: how-to/extend/add_processing_layer.md
        extending/add_solver.md: how-to/extend/add_solver.md
        extending/gui_forms.md: how-to/extend/gui_forms.md
        getting_started/concepts.md: concepts/core_concepts.md
        getting_started/first_simulation.md: tutorials/first_simulation.md
        getting_started/installation.md: tutorials/installation.md
        getting_started/quickstart.md: tutorials/quickstart.md
        getting_started/quickstart_cli.md: tutorials/quickstart_cli.md
        getting_started/quickstart_extend.md: tutorials/quickstart_extend.md
        getting_started/quickstart_gui.md: tutorials/quickstart_gui.md
        getting_started/quickstart_world.md: tutorials/quickstart_world.md
        tutorials/custom_pipeline.md: tutorials/batch_processing_tutorial.md
        tutorials/parameter_sweeps.md: tutorials/batch_processing_tutorial.md
        user_guide/agent_design_loop.md: agents/design_loop.md
        user_guide/agent_export.md: agents/export.md
        user_guide/agent_setup.md: agents/setup.md
        user_guide/agent_skills.md: agents/skills.md
        user_guide/analog_readouts.md: how-to/analog_readouts.md
        user_guide/batch_processing.md: how-to/batch_processing.md
        user_guide/bundles.md: reference/bundles.md
        user_guide/cli.md: reference/cli.md
        user_guide/composite_grid.md: how-to/composite_grid.md
        user_guide/configuration_schema.md: reference/configuration_schema.md
        user_guide/describe.md: reference/describe.md
        user_guide/designing_stimuli.md: how-to/designing_stimuli.md
        user_guide/equation_dsl.md: how-to/equation_dsl.md
        user_guide/evaluate_pipeline.md: how-to/evaluate/evaluate_pipeline.md
        user_guide/evaluation_browser.md: how-to/evaluate/evaluation_browser.md
        user_guide/evaluation_export.md: how-to/evaluate/evaluation_export.md
        user_guide/event_encoders.md: how-to/event_encoders.md
        user_guide/extended_stimuli.md: how-to/extended_stimuli.md
        user_guide/gui_walkthrough.md: how-to/gui_walkthrough.md
        user_guide/overview.md: index.md
        user_guide/presets.md: how-to/presets.md
        user_guide/receptive_fields.md: how-to/receptive_fields.md
        user_guide/solvers.md: how-to/solvers.md
        user_guide/units_and_gains.md: how-to/units_and_gains.md
        user_guide/worlds.md: how-to/worlds.md
        user_guide/yaml_configuration.md: how-to/yaml_configuration.md
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - footnotes
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

