[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sensoryforge"
version = "0.2.0"
description = "Modular, extensible framework for simulating sensory encoding across modalities"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ben Efron", email = "benefron@gmail.com" },
]
maintainers = [
    { name = "Ben Efron", email = "benefron@gmail.com" },
]
keywords = [
    "sensory encoding",
    "spiking neural networks",
    "computational neuroscience",
    "tactile simulation",
    "pytorch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "torch>=1.12.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "PyYAML>=6.0",
    "tqdm>=4.60",
    "matplotlib>=3.5",
    "plotly>=5.0",
]

[project.optional-dependencies]
gui = [
    "PyQt5>=5.15.0",
    "pyqtgraph>=0.12.0",
]
hdf5 = [
    "h5py>=3.0",
]
solvers = [
    "torchdiffeq>=0.2.3",
]
dsl = [
    "sympy>=1.11",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.950",
    "pydocstyle>=6.1",
]
docs = [
    "mkdocs>=1.3.0",
    "mkdocs-material>=8.0.0",
    "mkdocstrings[python]>=0.20",
]

[project.urls]
Homepage = "https://github.com/benefron/sensoryforge"
Repository = "https://github.com/benefron/sensoryforge"
Issues = "https://github.com/benefron/sensoryforge/issues"

[project.scripts]
sensoryforge = "sensoryforge.cli:main"

[tool.setuptools.packages.find]
include = ["sensoryforge*"]

[tool.setuptools.package-data]
sensoryforge = ["config/*.yml", "gui/*.json"]
