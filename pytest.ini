[pytest]
testpaths = tests
addopts = -p no:cacheprovider
# A test running over 2 minutes dumps every thread's stack (a hang shows where).
faulthandler_timeout = 120
markers =
    gui: PyQt5/Qt-backed tests (F-016: order-dependent, run with `pytest -m gui`)
    slow: slow-running tests, excluded from the fast default loop
    scale: large world-to-report runs (skipped unless `pytest -m scale` or `--run-scale`; sizes from SF_SCALE_* variables)
    agents: fresh-agent skill scenarios (skipped unless `pytest -m agents` or `--run-agents`; each costs a real agent run)
